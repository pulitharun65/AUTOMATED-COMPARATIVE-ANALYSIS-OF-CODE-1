name: Full research artifact verification (connected runner)
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'dataset/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'run_analysis.py'
      - 'config.py'
      - 'pyproject.toml'
      - '.github/workflows/independent-full-verification.yml'

jobs:
  rerun:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact dependencies from requirements file
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pip freeze | sort > verification/ci_installed_packages.txt
      - name: Preserve original archived metrics before fresh run
        run: cp outputs/metrics.csv verification/ci_original_metrics_before_run.csv
      - name: Record immutable source inputs and task integrity
        run: |
          python tools/provenance_inventory.py
          python tools/audit_repro_evidence.py
      - name: Execute every framework test, including static-tool integration
        run: python -m pytest tests/ -q > verification/ci_full_tests.log 2>&1
      - name: Fresh Radon, Pylint, Bandit and full end-to-end run
        run: |
          radon --version > verification/ci_static_tool_versions.log
          python -m pylint --version >> verification/ci_static_tool_versions.log
          python -m bandit --version >> verification/ci_static_tool_versions.log
          python run_analysis.py --verbose > verification/ci_full_analysis.log 2>&1
      - name: Assert fresh outputs have task/sample coverage and valid stats
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json
          with open('outputs/metrics.csv', newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 210, f'{len(rows)} rows found'
          keys = {(r['task_id'], r['source'], r['sample']) for r in rows}
          assert len(keys) == 210, 'Duplicate task/source/sample keys'
          assert all(r['mean_cc'] not in ('', 'None') for r in rows), 'Missing complexity metrics'
          assert all(r['pylint_score'] not in ('', 'None') for r in rows), 'Missing Pylint metrics'
          assert all(r['bandit_total'] not in ('', 'None') for r in rows), 'Missing Bandit metrics'
          with open('outputs/stats.json', encoding='utf-8') as f:
              stats = json.load(f)
          assert 'metrics' in stats and 'functional' in stats
          with open('verification/ci_original_metrics_before_run.csv', newline='', encoding='utf-8') as f:
              old = list(csv.DictReader(f))
          keys_old = {(r['task_id'], r['source'], r['sample']):str(r['functional_pass']).lower() for r in old}
          keys_new = {(r['task_id'], r['source'], r['sample']):str(r['functional_pass']).lower() for r in rows}
          assert keys_old == keys_new, 'Fresh functional results differ from archived outcomes: investigate'
          for file in ('report/report.docx','report/report.md','report/dashboard.html',
                       'figures/matched_inference_summary.png'):
              assert Path(file).is_file(), f'Missing {file}'
          print('Fresh run verified: complete 210-row metrics and report outputs')
          PY
      - name: Hash final evidence
        if: always()
        run: |
          find verification -maxdepth 1 -type f -name 'ci_*' -print | sort
          sha256sum outputs/metrics.csv outputs/stats.json > verification/ci_generated_hashes.txt 2>/dev/null || true
      - name: Publish raw evidence even if validation failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independently-rerun-artifacts
          retention-days: 30
          if-no-files-found: warn
          path: |
            verification/ci_*
            verification/provenance_inventory.json
            verification/archived_integrity_audit.json
            outputs/
            report/
            figures/
